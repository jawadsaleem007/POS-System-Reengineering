<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <nav class="bg-blue-600 p-4 text-white flex justify-between items-center">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold"><a href="{{ url_for('index') }}">POS System</a></h1>
            <div>
                <a href="{{ url_for('index') }}" class="text-white hover:underline mr-4">Dashboard</a>
                <a href="{{ url_for('logout') }}" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="flex-1 flex overflow-hidden">
        <!-- Item Grid -->
        <div class="flex-1 p-4 overflow-y-auto">
            <h2 class="text-2xl font-bold mb-4">Available Items</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                {% for item in items %}
                <div class="bg-white p-4 rounded shadow hover:shadow-lg cursor-pointer transition" onclick="addToCart({{ item.id }}, '{{ item.name }}', {{ item.price }})">
                    <h3 class="font-bold text-lg">{{ item.name }}</h3>
                    <p class="text-gray-600">${{ "%.2f"|format(item.price) }}</p>
                    <p class="text-xs text-gray-400">Stock: {{ item.stock_quantity }}</p>
                </div>
                {% endfor %}
            </div>
        </div>
        
        <!-- Cart Sidebar -->
        <div class="w-96 bg-white shadow-xl flex flex-col">
            <div class="p-4 border-b">
                <h2 class="text-xl font-bold">Current Sale</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-4" id="cart-items">
                <!-- Cart items will appear here -->
                <p class="text-gray-500 text-center mt-10">Cart is empty</p>
            </div>
            <div class="p-4 border-t bg-gray-50">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="coupon">Coupon Code</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="coupon" type="text" placeholder="Enter code (e.g. SAVE10)">
                </div>
                <div class="flex justify-between text-xl font-bold mb-4">
                    <span>Total:</span>
                    <span id="cart-total">$0.00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded">
                    Complete Sale
                </button>
            </div>
        </div>
    </div>

    <script>
        let cart = {};

        function addToCart(id, name, price) {
            if (cart[id]) {
                cart[id].quantity++;
            } else {
                cart[id] = { id, name, price, quantity: 1 };
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            
            if (Object.keys(cart).length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center mt-10">Cart is empty</p>';
                totalEl.innerText = '$0.00';
                return;
            }

            let html = '';
            let total = 0;

            for (const id in cart) {
                const item = cart[id];
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                html += `
                    <div class="flex justify-between items-center mb-3 pb-3 border-b">
                        <div>
                            <div class="font-bold">${item.name}</div>
                            <div class="text-sm text-gray-600">$${item.price.toFixed(2)} x ${item.quantity}</div>
                        </div>
                        <div class="font-bold">$${itemTotal.toFixed(2)}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
            totalEl.innerText = '$' + total.toFixed(2);
        }

        async function checkout() {
            if (Object.keys(cart).length === 0) return;

            const couponCode = document.getElementById('coupon').value;
            const cartArray = Object.values(cart);
            
            try {
                const response = await fetch('/pos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        cart: cartArray,
                        coupon: couponCode
                    }),
                });

                const result = await response.json();
                
                if (response.ok) {
                    let msg = 'Sale completed successfully!';
                    if (result.discount > 0) {
                        msg += `\nDiscount Applied: $${result.discount.toFixed(2)}\nFinal Total: $${result.final_total.toFixed(2)}`;
                    }
                    alert(msg);
                    cart = {};
                    document.getElementById('coupon').value = '';
                    updateCartUI();
                    window.location.reload(); // Refresh to update stock
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during checkout.');
            }
        }
    </script>
</body>
</html>
